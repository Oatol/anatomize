[package]
name = "anatomize-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "离线工具：headless 实验、帧渲染、资产校验"

[dependencies]
anatomize-core = { path = "../anatomize-core" }
anatomize-body = { path = "../anatomize-body" }
anatomize-sim = { path = "../anatomize-sim" }
anatomize-cut = { path = "../anatomize-cut" }
anatomize-tissue = { path = "../anatomize-tissue" }
anatomize-physio = { path = "../anatomize-physio" }
png = "0.18.1"
# 中文字形光栅化。只有 tools 用得到，核心 crate 依然零渲染依赖。
fontdue = "0.9.5"

[[bin]]
name = "ragdoll"
path = "src/main.rs"

[[bin]]
name = "cut_demo"
path = "src/bin/cut_demo.rs"

[[bin]]
name = "tissue_demo"
path = "src/bin/tissue_demo.rs"

[[bin]]
name = "m3_demo"
path = "src/bin/m3_demo.rs"

[[bin]]
name = "m4_demo"
path = "src/bin/m4_demo.rs"

[[bin]]
name = "m5_demo"
path = "src/bin/m5_demo.rs"

[[bin]]
name = "m6_demo"
path = "src/bin/m6_demo.rs"

[[bin]]
name = "scan"
path = "src/bin/scan.rs"

[[bin]]
name = "p05_demo"
path = "src/bin/p05_demo.rs"
